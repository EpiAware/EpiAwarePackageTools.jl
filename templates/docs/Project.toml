# PACKAGE-OWNED — scaffold writes this once and never overwrites it.
# The documentation environment: Documenter + DocumenterVitepress. Add
# doc-only deps (e.g. plotting, DocumenterCitations) as the docs grow. The
# package is pinned by path via `[sources]`; the kit is a docs dep too
# (`docs/make.jl` calls `using EpiAwarePackageTools`), bounded in
# `[compat]` like any other registered dep.
#
# With `ad = true`, also carries what the AD-comparison page executes
# against: the `ADFixtures` registry (path-pinned) plus the benchmark and
# plotting stack. With `benchmarks = true`, also carries
# `Plots` for the benchmark page's trend plot (lazily loaded; absent here,
# the plot degrades to an `@info` note rather than failing the build).
[deps]
{{AD_DOCS_DEPS}}{{BENCH_DOCS_DEPS}}Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
DocumenterCitations = "daee34ce-89f3-4625-b898-19384cb65244"
DocumenterVitepress = "4710194d-e776-4893-9690-8d956a29c365"
{{KIT_DEP_LINE}}Literate = "98b081ad-f1c9-55d3-8b20-4c87d4299306"
{{PACKAGE}} = "{{UUID}}"

[sources]
{{PACKAGE}} = {path = ".."}{{AD_DOCS_SOURCES}}

[compat]
{{AD_DOCS_COMPAT}}{{BENCH_DOCS_COMPAT}}Documenter = "1"
DocumenterCitations = "1"
DocumenterVitepress = "0.3"
{{KIT_COMPAT_LINE}}Literate = "2"
