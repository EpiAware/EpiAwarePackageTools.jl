# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: 'Increment Version'
description: 'Increment version in Project.toml and create PR'
inputs:
  increment-type:
    description: 'Type of version increment: major, minor, or patch'
    required: true
  create-pr:
    description: 'Whether to create a PR (true) or just increment on current branch (false)'
    required: false
    default: 'true'
  pr-title-prefix:
    description: 'Prefix for PR title'
    required: false
    default: 'chore: increment version'
  assignee:
    description: >-
      GitHub username/bot to assign the PR to, or empty for no assignee. Must
      not be a bare org: GitHub rejects assigning an org and the update path
      fails with replaceActorsForAssignable. Defaults to the reviewer handle,
      or empty when none was configured.
    required: false
    default: '{{ASSIGNEE_DEFAULT}}'
outputs:
  old-version:
    description: 'The previous version'
    value: ${{ steps.increment.outputs.old-version }}
  new-version:
    description: 'The new version'
    value: ${{ steps.increment.outputs.new-version }}
  pr-number:
    description: 'PR number if created or existing PR found'
    value: ${{ steps.create-pr.outputs.pr-number || steps.use-existing-pr.outputs.pr-number }}
  existing-pr:
    description: 'Whether an existing PR was found'
    value: ${{ steps.check-pr.outputs.existing-pr }}

runs:
  using: 'composite'
  steps:
    - name: Get current version and increment
      id: increment
      shell: bash
      run: |
        CURRENT_VERSION=$(grep '^version = ' Project.toml | sed 's/version = "\(.*\)"/\1/')
        echo "Current version: $CURRENT_VERSION"

        # Strip any pre-release/build suffix before parsing. Everything the
        # kit scaffolds starts pre-release ("0.1.0-DEV") and unpublished, so
        # the correct transition is to RELEASE what the number already says,
        # not increment past it. Without this, `IFS='.'` leaves PATCH as
        # "0-DEV" and `$(( PATCH + 1 ))` coerces it to 1, so the maiden
        # published version would be 0.1.1 and 0.1.0 silently skipped (#255).
        BASE_VERSION="${CURRENT_VERSION%%[-+]*}"

        # Parse version parts from the released base, so PATCH is clean.
        IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}

        if [ "$BASE_VERSION" != "$CURRENT_VERSION" ]; then
          # Pre-release/build suffix present: publish the base version as-is.
          NEW_VERSION="$BASE_VERSION"
          echo "Pre-release version '$CURRENT_VERSION' detected: releasing" \
               "$NEW_VERSION (suffix stripped, no increment)."
        else
          case "${{ inputs.increment-type }}" in
            "major")
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="${NEW_MAJOR}.0.0"
              ;;
            "minor")
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
              ;;
            "patch")
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
              ;;
            *)
              echo "Error: Invalid increment type '${{ inputs.increment-type }}'. Must be major, minor, or patch."
              exit 1
              ;;
          esac
        fi

        echo "New version: $NEW_VERSION"
        echo "old-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
        # The existing-branch check and the push both key off the same
        # branch name, computed once here rather than in each step that
        # needs it.
        echo "branch-name=auto/version-increment-${NEW_VERSION}" >> \
          $GITHUB_OUTPUT

        sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" Project.toml

    - name: Check for existing PR
      id: check-pr
      if: inputs.create-pr == 'true'
      shell: bash
      run: |
        BRANCH_NAME="${{ steps.increment.outputs.branch-name }}"

        # Checking the ref directly, rather than searching PR titles, also
        # catches a branch whose PR was closed or was never created (see
        # "Create PR" below), not only one with a currently open PR by that
        # title.
        # The SHA doubles as the `--force-with-lease` expected value for the
        # push in the Create PR step, so a stale branch from an earlier run
        # is refreshed rather than permanently blocking this version.
        REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)
        echo "branch-sha=$REMOTE_SHA" >> $GITHUB_OUTPUT

        EXISTING_PR=$(gh pr list --state open --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')

        if [ -n "$EXISTING_PR" ]; then
          echo "existing-pr=true" >> $GITHUB_OUTPUT
          echo "existing-pr-number=$EXISTING_PR" >> $GITHUB_OUTPUT
          echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME. Skipping PR creation."
        else
          echo "existing-pr=false" >> $GITHUB_OUTPUT
          if [ -n "$REMOTE_SHA" ]; then
            echo "Branch $BRANCH_NAME exists with no open PR (closed, or creation failed previously). Recreating the PR."
          else
            echo "No existing branch or PR found for $BRANCH_NAME. Proceeding with PR creation."
          fi
        fi

    - name: Create PR
      id: create-pr
      if: inputs.create-pr == 'true' && steps.check-pr.outputs.existing-pr == 'false'
      # Some orgs forbid Actions from opening PRs, so `gh pr create` below
      # can fail even though the branch push above it succeeds. Continuing
      # on error lets the "Commit directly to branch" step recover instead
      # of the job failing with the version bump stranded on a pushed,
      # PR-less branch.
      continue-on-error: true
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        OLD_VERSION="${{ steps.increment.outputs.old-version }}"
        NEW_VERSION="${{ steps.increment.outputs.new-version }}"
        INCREMENT_TYPE="${{ inputs.increment-type }}"
        BRANCH_NAME="${{ steps.increment.outputs.branch-name }}"
        REMOTE_SHA="${{ steps.check-pr.outputs.branch-sha }}"

        git checkout -b "$BRANCH_NAME"

        git add Project.toml
        git commit -m "${{ inputs.pr-title-prefix }} to $NEW_VERSION

        Automatically incremented $INCREMENT_TYPE version.

        Previous version: $OLD_VERSION
        New version: $NEW_VERSION"

        # force-with-lease against the SHA `Check for existing PR` observed
        # just before this run: a stale branch left by an earlier run for
        # the same version does not block this push permanently. The
        # explicit lease value (rather than a bare --force-with-lease) is
        # necessary because `actions/checkout` never populates a
        # remote-tracking ref for $BRANCH_NAME to lease against implicitly;
        # an empty REMOTE_SHA asserts the ref must not exist yet.
        git push --force-with-lease="refs/heads/$BRANCH_NAME:$REMOTE_SHA" origin "$BRANCH_NAME"

        # Only assign when a handle was configured. Assigning a bare org (the
        # fallback when no reviewer is set) errors on the update-existing-PR
        # path, so skip the flag entirely when empty (#122).
        ASSIGNEE_ARGS=()
        if [ -n "${{ inputs.assignee }}" ]; then
          ASSIGNEE_ARGS=(--assignee "${{ inputs.assignee }}")
        fi

        PR_OUTPUT=$(gh pr create \
          --title "${{ inputs.pr-title-prefix }} to $NEW_VERSION" \
          --body "This PR automatically increments the version from \`$OLD_VERSION\` to \`$NEW_VERSION\` as a **$INCREMENT_TYPE** release.

        ## Changes
        - Updated \`version\` in \`Project.toml\` from \`$OLD_VERSION\` to \`$NEW_VERSION\`

        ## Version Increment Type
        - **$INCREMENT_TYPE** release: $(case $INCREMENT_TYPE in
          major) echo "Breaking changes or major new features" ;;
          minor) echo "New features, backwards compatible" ;;
          patch) echo "Bug fixes and small improvements" ;;
        esac)

        ## Review Checklist
        - [ ] Version increment type is appropriate ($INCREMENT_TYPE)
        - [ ] No other changes needed for this release

        *This PR was created automatically by the Version Increment workflow.*" \
          --base main \
          --head "$BRANCH_NAME" \
          "${ASSIGNEE_ARGS[@]}")

        # Parsed explicitly and checked, so a `gh pr create` output that
        # doesn't contain a PR number fails loudly with the actual output
        # rather than behind a masked grep exit code.
        PR_NUMBER=$(echo "$PR_OUTPUT" | grep -o '/pull/[0-9]*' | grep -o '[0-9]*' || true)
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::Could not parse a PR number from gh pr create output:"
          echo "$PR_OUTPUT"
          exit 1
        fi
        echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "Created PR #$PR_NUMBER"

    - name: Use existing PR
      id: use-existing-pr
      if: inputs.create-pr == 'true' && steps.check-pr.outputs.existing-pr == 'true'
      shell: bash
      run: |
        EXISTING_PR_NUMBER="${{ steps.check-pr.outputs.existing-pr-number }}"
        echo "pr-number=$EXISTING_PR_NUMBER" >> $GITHUB_OUTPUT
        echo "Using existing PR #$EXISTING_PR_NUMBER"

    - name: Commit directly to branch
      # Two different conditions reach this step, and it serves both:
      #   - inputs.create-pr == 'false': the deliberate direct-commit
      #     configuration `version-on-demand.yaml` uses, committing onto
      #     whichever branch is already checked out.
      #   - steps.create-pr.outcome == 'failure': the create-pr path pushed
      #     its branch but `gh pr create` itself failed (e.g. the org
      #     disallows Actions opening PRs), so this step lands the commit
      #     directly instead. Checked via outcome rather than the
      #     failure() status function: `continue-on-error` on the Create PR
      #     step masks its conclusion to success, keeping the job out of a
      #     failing state and the implicit `success()` this step's
      #     condition is ANDed with true; failure() never fires here.
      if: inputs.create-pr == 'false' || steps.create-pr.outcome == 'failure'
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        if [ "${{ inputs.create-pr }}" = "false" ]; then
          OLD_VERSION="${{ steps.increment.outputs.old-version }}"
          NEW_VERSION="${{ steps.increment.outputs.new-version }}"
          INCREMENT_TYPE="${{ inputs.increment-type }}"

          git add Project.toml
          git commit -m "${{ inputs.pr-title-prefix }} to $NEW_VERSION

          Automatically incremented $INCREMENT_TYPE version.

          Previous version: $OLD_VERSION
          New version: $NEW_VERSION"

          git pull && git push
        else
          # The Create PR step already committed and pushed the version bump
          # to $BRANCH_NAME before `gh pr create` failed, so there is nothing
          # left to commit here. Land that existing commit on main directly
          # instead of leaving it stranded on a PR-less branch.
          BRANCH_NAME="${{ steps.increment.outputs.branch-name }}"
          echo "gh pr create failed; pushing the already-committed version bump on $BRANCH_NAME straight to main."
          git push origin "$BRANCH_NAME:main"
        fi
