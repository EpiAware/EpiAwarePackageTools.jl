# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: {{ORG}}/.github/.github/workflows/runic-check.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    # `runic-check.yml` does not install Runic itself — pre-commit's native
    # `language: julia` builds the hook's own env from the
    # `.pre-commit-config.yaml` `additional_dependencies` pin. Instead it
    # greps this repo's `.pre-commit-config.yaml` for the literal string
    # `Runic@{{RUNIC_VERSION}}` and fails if absent, so this input and that
    # pin must agree (single source: `{{RUNIC_VERSION}}`).
    with:
      runic_version: '{{RUNIC_VERSION}}'
    secrets: inherit  # pragma: allowlist secret
