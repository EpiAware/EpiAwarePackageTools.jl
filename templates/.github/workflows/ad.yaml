# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: AD

# Drives the per-backend AD gradient matrix (the shipped `test/ad/` harness).
# Per-flag coverage upload and job mechanics live in the reusable; this is
# the thin caller.
#
# `backends` is passed explicitly (built from `_AD_BACKENDS`, the kit's
# single source of truth) rather than left to the reusable's own default,
# so the CI matrix can never drift from the badges/codecov flags this
# package generates.
#
# The reusable's matrix is `backend x leg`: `test` (correctness, coverage)
# and `bench` (uninstrumented, writes the AD-comparison page's artefacts).
# The reusable decides per event whether a `bench` job runs;
# `workflow_dispatch` and the `labeled` PR type below exist so a `bench` run
# can be requested without a `main` push.

on:
  push:
    branches: [main]
    # Skip the heavy 7-backend sweep only for changes that cannot alter a
    # gradient result (prose docs, markdown); everything else — src/, ext/,
    # test/, Project.toml, benchmark/, the workflow itself — still triggers
    # it. Only skips when EVERY changed file matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    # `labeled` on top of the default set so adding `benchmark` to an
    # already-open PR re-triggers this workflow; the reusable's `bench` jobs
    # then run because the label is present, not because anything changed.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ad:
    uses: {{ORG}}/.github/.github/workflows/ad.yml@42a0501ccacefbfc2f2eeca640714a19c50bfe58
    with:
      backends: '{{AD_BACKENDS_JSON}}'
    secrets: inherit  # pragma: allowlist secret
