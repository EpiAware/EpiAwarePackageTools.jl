# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: AD

# Drives the per-backend AD gradient matrix (the shipped `test/ad/` harness).
# Per-flag coverage upload and job mechanics live in the reusable; this is
# the thin caller.
#
# `backends` is passed explicitly (built from `_AD_BACKENDS`, the kit's
# single source of truth) rather than left to the reusable's own default,
# so the CI matrix can never drift from the badges/codecov flags this
# package generates.

on:
  push:
    branches: [main]
    # Skip the heavy 6-backend sweep only for changes that cannot alter a
    # gradient result (prose docs, markdown); everything else — src/, ext/,
    # test/, Project.toml, benchmark/, the workflow itself — still triggers
    # it. Only skips when EVERY changed file matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ad:
    uses: {{ORG}}/.github/.github/workflows/ad.yml@6fcdcde033ec670ac3832b239427fd2ded591bbc
    with:
      backends: '{{AD_BACKENDS_JSON}}'
    secrets: inherit  # pragma: allowlist secret
