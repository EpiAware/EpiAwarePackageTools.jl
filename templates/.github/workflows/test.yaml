# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: EpiAware/.github/.github/workflows/tests.yml@491d0d9979bb59b0f82fc508ca55fb31698eb840
    with:
      # The matrix this package tests on. Seeded, not managed: name your own
      # value here and a resync keeps it. The lts leg runs
      # Pkg.test, which develops the package under test, so the [sources] pin
      # in test/Project.toml being a Pkg 1.11 feature costs it nothing; the
      # jet/ad/docs/benchmark environments that do need the pin are separate
      # jobs on the current release. A package pinning an unregistered
      # dependency by git [sources] is seeded without lts instead.
      julia_versions: {{JULIA_TEST_VERSIONS}}
      # Collect coverage on the ubuntu leg that already runs the whole
      # suite and upload it, rather than running a second full suite just
      # for coverage. The reusable's `fail_ci_if_error` defaults to true,
      # so a repo with no CODECOV_TOKEN still goes red rather than green
      # with silently missing coverage; that is org policy and is left at
      # the default rather than restated here.
      upload_coverage: true
    secrets: inherit  # pragma: allowlist secret{{DOWNGRADE_COMPAT_JOB}}
