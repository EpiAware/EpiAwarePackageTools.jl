name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: {{ORG}}/.github/.github/workflows/tests.yml@155fc902a533f8dc33b9928322f5d46add789f75
    with:
      # The test environment depends on EpiAwarePackageTools, whose own
      # [compat] julia starts at 1.11, so an lts (1.10) leg cannot resolve it.
      # This is a statement about the matrix, not about what this package
      # supports: its own [compat] julia is free to reach 1.10 (#410). The
      # reusable defaults to ["1", "lts", "pre"]; drop the lts leg.
      julia_versions: {{JULIA_TEST_VERSIONS}}
    secrets: inherit  # pragma: allowlist secret{{DOWNGRADE_COMPAT_JOB}}
