# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: TagBot

# TagBot's usual trigger is the comment `JuliaTagBot` posts on the registration
# issue/PR once a General registry PR merges. That comment only arrives if the
# TagBot GitHub App has access to this repo, so an app installed for selected
# repositories only leaves a package registered in General with no git tag and
# no GitHub release (ComposedDistributions.jl 0.1.0). The `schedule:` trigger
# removes that dependency: TagBot asks the registry itself which versions are
# registered and tags any that are missing, so a run on a timer recovers a
# release the comment path never delivered.
on:
  issue_comment:
    types:
      - created
  schedule:
    # Daily at 03:17 UTC. Deliberately off :00 and :30, where GitHub's cron
    # queue is busiest and scheduled runs are dropped or delayed the most.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

jobs:
  TagBot:
    # `schedule` and `workflow_dispatch` runs have no triggering comment, so the
    # `JuliaTagBot` actor check cannot admit them and each event is named.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.actor == 'JuliaTagBot'
    uses: {{ORG}}/.github/.github/workflows/tagbot.yml@6fcdcde033ec670ac3832b239427fd2ded591bbc
    with:
      # `github.event.inputs` is absent on `schedule` and `issue_comment`, where
      # the expression resolves to null and `||` falls through to '3' — TagBot's
      # own default window. Three days against a daily cron overlaps, so one
      # skipped scheduled run still tags the release on the next one.
      lookback: ${{ github.event.inputs.lookback || '3' }}
    secrets: inherit  # pragma: allowlist secret
