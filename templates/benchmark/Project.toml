# PACKAGE-OWNED — scaffold writes this once and never overwrites it.
# The benchmark environment, so `julia --project=benchmark benchmark/run.jl`
# resolves. Seeded with BenchmarkTools, the package, the shared
# EpiAwarePackageTools benchmark harness, and (for an AD package) the
# `ADFixtures` registry the seeded gradient suite measures.
[deps]
{{AD_BENCH_FIXTURES_DEP}}BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
{{AD_BENCH_DI_DEP}}{{KIT_DEP_LINE}}{{PACKAGE}} = "{{UUID}}"

[sources]
{{AD_BENCH_SOURCES}}{{PACKAGE}} = {path = ".."}

[compat]
{{KIT_COMPAT_LINE}}BenchmarkTools = "1"{{AD_BENCH_COMPAT}}
