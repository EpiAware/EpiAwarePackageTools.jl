# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
#
# Closes an auto-increment PR, and deletes its branch, once the package
# version on main has reached or passed the version the PR proposes (thin
# caller of the EpiAware/.github reusable). Orphaned auto-increment
# branches carrying no open PR are swept as well. See the reusable
# workflow's own header for the safety rules it applies to each.
#
# A push to main reaps what a landed release supersedes straight away,
# the schedule catches a version that moved by a route that does not push
# to main, and `workflow_dispatch` allows an on-demand run.
#
# A separate workflow rather than a job bolted onto
# `auto-version-increment.yaml`: the two share no state (this reads
# `Project.toml` and open PRs, that one only pushes a branch), the
# trigger sets differ (this one also runs on a schedule), and keeping
# them apart means a failure reaping old PRs can never block the workflow
# that proposes new ones, or the other way round.

name: Version PR Reaper

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:00 UTC -- between template-sync's Monday 04:00
    # and release-nudge's Monday 06:00 UTC runs so the three scheduled
    # jobs don't contend for runners.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be closed without changing anything'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # contents: write to delete branches, pull-requests: write to close
  # PRs. Capped by the caller here too, since the reusable's own
  # job-level grant cannot exceed what the caller allows.
  contents: write
  pull-requests: write

jobs:
  reap:
    uses: EpiAware/.github/.github/workflows/version-pr-reaper.yml@a6d230a9b2338d2802d8876f9e8b5377489dcdb6
    with:
      # The reusable honours `dry_run` on whatever trigger fires, so the
      # caller decides when a run is a preview: only a dispatch with the
      # box ticked. On push and schedule `inputs.dry_run` is unset and
      # this resolves to `false`, as a string, which is what the
      # reusable's input takes.
      dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
    secrets: inherit  # pragma: allowlist secret
