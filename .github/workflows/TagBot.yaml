# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: TagBot

on:
  issue_comment:
    types:
      - created
  schedule:
    # Daily catch-all: the JuliaTagBot GitHub App comment this
    # workflow otherwise waits for has never once arrived in org history,
    # so without this trigger every release is tagged manually. TagBot is
    # idempotent and re-tags nothing, so a daily run costs one short job.
    # Offset from the weekly template-sync (Mon 04:00 UTC) and
    # release-nudge (Mon 06:00 UTC) schedules so runners don't contend.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

jobs:
  TagBot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.actor == 'JuliaTagBot'
    uses: EpiAware/.github/.github/workflows/tagbot.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    with:
      lookback: ${{ github.event.inputs.lookback || '3' }}
    secrets: inherit  # pragma: allowlist secret
