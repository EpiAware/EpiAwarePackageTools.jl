# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    uses: EpiAware/.github/.github/workflows/tagbot.yml@4ade02869137af2a1799c704df8a0256ef5b5de6
    with:
      lookback: ${{ github.event.inputs.lookback || '3' }}
    secrets: inherit  # pragma: allowlist secret

  # Without a `DOCUMENTER_KEY` deploy key TagBot creates the release tag with
  # the Actions app token, and GitHub raises no `push` or `release` event for a
  # ref that token created. The managed `Documenter` workflow then never runs
  # at a release tag, so the package publishes `dev` docs and never a versioned
  # `stable`. `workflow_dispatch` is one of the two events GitHub does raise
  # from the app token, so dispatch the docs build for the latest release when
  # it has no run of its own. Idempotent, and it backfills a release tagged
  # before this job existed. Adding the deploy key (see `setup_checklist`) is
  # still the better fix: it also lets TagBot tag a commit that touches
  # workflow files, which the app token is refused outright.
  ReleaseDocs:
    needs: TagBot
    # An explicit `if` overrides the default "only when `needs` succeeded", so
    # this runs after a FAILED TagBot too: TagBot reports failure when it could
    # not tag some version while still having released others, which is exactly
    # when the release docs are missing. `!cancelled()` rather than `always()`
    # so a cancelled run does not still dispatch a build. A skipped TagBot means
    # a non-TagBot comment, so there is nothing to check.
    if: ${{ !cancelled() && needs.TagBot.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `actions: write` to dispatch the docs build; `contents: read` so `gh`
      # can read the releases list.
      actions: write
      contents: read
    steps:
      - name: Build docs for the latest release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The releases list, not `releases/latest`: the latter 404s on a
          # package with no release yet, and `gh api` writes an error body to
          # stdout, so the 404 JSON would be captured as the tag. The list
          # answers 200 with `[]` instead. Drafts are skipped; TagBot
          # publishes outright.
          tag=$(gh api "repos/$REPO/releases?per_page=10" \
            --jq '[.[] | select(.draft | not)][0].tag_name // ""')
          if [ -z "$tag" ]; then
            echo "No published release yet; nothing to build."
            exit 0
          fi
          # A package that DOES have the deploy key gets its tag over SSH, and
          # the resulting push run appears about two seconds later. Settle
          # first so that run is visible: dispatching a second build at the
          # same ref would land in the same concurrency group as the push run
          # (document.yaml keys its group on workflow + ref, and cancels in
          # progress), and cancel the run it was racing. Written without an
          # Actions expression on purpose -- those are substituted throughout
          # a run block, comments included, so naming the group literally here
          # would render expanded in the job log.
          sleep 30
          # A run at a tag reports the tag name as its `branch`. Guarded like
          # the call above: a repo whose docs workflow is not `document.yaml`
          # 404s here, and an unguarded `gh api` under `set -e` would red
          # TagBot on every release rather than skip a build it cannot find.
          runs_url="repos/$REPO/actions/workflows/document.yaml/runs"
          if ! runs=$(gh api "$runs_url?branch=$tag&per_page=1" \
            --jq .total_count 2>/dev/null); then
            echo "::warning::No document.yaml workflow in $REPO, so the docs" \
              "for $tag cannot be built here. Build them by hand."
            exit 0
          fi
          if [ "$runs" != "0" ]; then
            echo "Documenter has already run at $tag; nothing to do."
            exit 0
          fi
          echo "No Documenter run at $tag; dispatching one."
          if ! gh workflow run document.yaml --repo "$REPO" --ref "$tag"; then
            echo "::warning::Could not dispatch Documenter at $tag (the" \
              "tagged commit may predate the managed workflow). Build it by" \
              "hand: Actions -> Documenter -> Run workflow -> $tag."
          fi
