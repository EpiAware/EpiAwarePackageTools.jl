# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
#
# Scheduled template-sync. Re-applies the managed EpiAware standard
# (`update("."; ad = false, benchmarks = false, downgrade_compat = true)`) and, when the
# committed infra has drifted from
# the kit, opens (or refreshes) a PR with the refresh. This is the auto-refresh
# half of the self-sync loop: the `self-drift` check guards every push/PR, and
# this workflow proactively pulls the newest standard on a schedule so a repo
# never silently falls behind.
#
# Refs are preserved: `update` keeps whatever reusable-workflow SHA Dependabot
# has pinned in this repo, so a sync never reverts a Dependabot bump — it only
# re-applies the rest of the managed standard.
#
# The sync only ever pushes to a branch it opened itself (#215), so it does no
# work on a pull request. The `pull_request` trigger is kept only so the `sync`
# check still reports on a Dependabot PR — as a clean green no-op, not the red
# it used to be under Dependabot's restricted token (#256). Drift on a
# Dependabot bump is caught by the next scheduled run.
#
# A scheduled run has no audience, so a failure that needs a human is reported
# as an issue on this repo rather than as a red X nobody opens (#352). One
# issue, labelled `template-sync`, is edited in place on each failing run and
# closed again by the first clean run.

name: Template sync

on:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch:
  # Present only so the `sync` check reports (green) on a Dependabot PR; the job
  # is a no-op on any pull request (see the job's skip step, #256).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # issues: write so a failing run can open, edit and close the single
  # `template-sync` tracking issue that tells the maintainer about the drift.
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # On a Dependabot PR this job runs under Dependabot's restricted context
      # (a read-only token, no access to Actions secrets). Every real step below
      # — installing the kit, `update`, opening a PR — needs that
      # access, so the job errored and every Dependabot PR carried a spurious
      # red `sync` (#256). It also could never have *fixed* anything from a PR:
      # the sync only pushes to a branch it opened itself (#215). So on a PR the
      # job is a clean no-op — a green check, no work — and the weekly scheduled
      # run is what actually detects drift and opens a `chore/template-sync` PR.
      # Kept as a running (green) job rather than an `if`-skipped one so a
      # required-check gate on `sync` stays satisfied on Dependabot PRs.
      - name: Skip on a pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "template-sync does not run on a pull request: it cannot push"
          echo "to a branch it did not open (#215), and the Dependabot context"
          echo "cannot access what a sync needs (#256). The weekly scheduled"
          echo "run detects drift and opens a chore/template-sync PR."
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        if: github.event_name != 'pull_request'
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request'
      - name: Fetch gh-pages so the docs custom domain can be reconciled
        if: github.event_name != 'pull_request'
        # update reconciles `docs/make.jl`'s deploy_url against the
        # gh-pages CNAME (a Pages custom domain set out of band): a mismatch
        # ships a CSS-less site that CI otherwise cannot see. The default
        # checkout does not fetch gh-pages, so fetch it here. `|| true` keeps a
        # repo with no gh-pages branch (docs never deployed) from failing.
        run: git fetch --depth=1 origin gh-pages || true
      - name: Re-apply the managed EpiAware standard
        if: github.event_name != 'pull_request'
        run: |
          julia --color=yes -e '
              using Pkg
              Pkg.activate("."); Pkg.instantiate()
              using EpiAwarePackageTools
              res = EpiAwarePackageTools.update("."; ad = false, benchmarks = false, downgrade_compat = true)
              println("re-applied ", length(res.updated), " managed files")'
      # Mint a GitHub App token so the sync PR can carry workflow-file drift.
      # The default `GITHUB_TOKEN` is forbidden from pushing anything under
      # `.github/workflows/` (GitHub rejects the push: "refusing to allow a
      # GitHub App to create or update workflow ... without workflows
      # permission"), so when the kit changes a managed *workflow* the sync
      # push failed and the weekly run went red. An App installation token
      # carrying `workflows: write` can push those files. Configure the org
      # (or repo) with a `TEMPLATE_SYNC_APP_ID` variable and a
      # `TEMPLATE_SYNC_APP_PRIVATE_KEY` secret for an App granted contents,
      # pull-requests and workflows write. When the App is not configured the
      # step is skipped and the token falls back to `GITHUB_TOKEN` below —
      # non-workflow drift still syncs; only workflow drift needs the App.
      # The `permission-*` inputs cap the minted token at exactly what
      # `create-pull-request` below needs (commit+push, open a PR, touch
      # `.github/workflows/`), regardless of what else the App may be
      # granted at install time.
      - name: Mint an App token that can push workflow files
        id: app-token
        if: ${{ github.event_name != 'pull_request' && vars.TEMPLATE_SYNC_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TEMPLATE_SYNC_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # Schedule / manual: open or refresh a sync PR when the standard drifted.
      - name: Open a PR if the standard drifted
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/template-sync
          delete-branch: true
          commit-message: "ci: sync managed infra to the EpiAware standard"
          title: "ci: sync managed infra to the EpiAware standard"
          labels: |
            ci
          body: |
            Automated re-apply of the managed EpiAwarePackageTools standard
            (`update("."; ad = false, benchmarks = false, downgrade_compat = true)`).

            Merge to bring this repo's managed infra back in line with the kit.
            Package-owned files (unit tests, `qa_config.jl`, AD scenarios,
            `LICENSE`) are never touched.
      # A clean run means any open tracker is stale, so close it. Without this
      # a repo that fixed its drift keeps an open issue about drift it no
      # longer has, and the tracker stops meaning anything.
      - name: Close the drift issue once a sync lands cleanly
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` otherwise infers the repo from the checked-out git remote,
          # which is not there yet if the run failed at or before checkout —
          # exactly a failure this step has to survive to report.
          GH_REPO: ${{ github.repository }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$run_url/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --state open --label template-sync \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$open" ]; then
            msg="Template sync ran cleanly, so this drift is resolved:"
            # `|| true` because failing to tidy up must not fail the step: the
            # reporter below is `if: failure()`, so a transient API error here
            # would red a sync that worked and then file drift against it.
            gh issue close "$open" --comment "$msg $run_url" || true
          fi
      # A scheduled run has no audience: the failure is a red X on the Actions
      # tab that recurs every week until someone happens to look (#352). Report
      # it where the maintainer will see it instead, and report it exactly
      # once — the open `template-sync` issue is edited in place, and a new
      # one is opened only when there is none, so a failure that repeats every
      # Monday does not become a pile of duplicate issues.
      - name: Report the drift as an issue when the sync fails
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` otherwise infers the repo from the checked-out git remote,
          # which is not there yet if the run failed at or before checkout —
          # exactly a failure this step has to survive to report.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$run_url/actions/runs/$GITHUB_RUN_ID"
          # The kit lives at one fixed address, not under the adopting repo's
          # own org, so this URL is a literal rather than a substituted org.
          kit=https://github.com/EpiAware/EpiAwarePackageTools.jl
          cat > "$RUNNER_TEMP/drift-issue.md" <<EOF
          The scheduled template-sync could not bring this repository back in
          line with the managed EpiAware standard, so its CI infrastructure is
          drifting from the kit.

          Failing run: $run_url

          ## What to do

          Take one of two routes. Editing the managed file to make the failure
          go away is not one of them: the next sync re-applies the standard and
          reverts it.

          1. **Fix the drift here.** Re-apply the standard locally and commit
             the result:

                 julia -e 'using EpiAwarePackageTools;
                 EpiAwarePackageTools.update("."; ad = false,
                 benchmarks = false,
                 downgrade_compat = true)'

          2. **Ask the kit for the flexibility.** If \`update\` throws, or it
             overwrites something this package legitimately needs to keep, that
             is a gap in the kit rather than something to work around here.
             Open an issue describing the usage that fails:
             $kit/issues/new

          Pushing a workflow file also needs the template-sync App configured
          (\`TEMPLATE_SYNC_APP_ID\` variable and
          \`TEMPLATE_SYNC_APP_PRIVATE_KEY\` secret); without it the sync can
          only carry non-workflow drift.

          ---

          Opened and updated by the Template sync workflow. This one issue is
          edited in place on each failing run, never duplicated, and closed
          again by the first clean run.
          EOF
          gh label create template-sync --force --color ededed \
            --description "Managed infra has drifted from the kit" >/dev/null
          open=$(gh issue list --state open --label template-sync \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file "$RUNNER_TEMP/drift-issue.md"
          else
            gh issue create --label template-sync \
              --title "Template sync failed: managed infra has drifted" \
              --body-file "$RUNNER_TEMP/drift-issue.md"
          fi
