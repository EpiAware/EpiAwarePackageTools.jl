name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: EpiAware/.github/.github/workflows/runic-check.yml@2c7ce73459772f11dad46ac7f456e35f0d296faf
    with:
      # `runic-check.yml` does not install Runic itself: pre-commit's native
      # `language: julia` builds the hook's own env from the
      # `.pre-commit-config.yaml` `additional_dependencies` spec. Instead it
      # greps this repo's `.pre-commit-config.yaml` for the literal string
      # `Runic@<runic_version>` and fails if absent, so this input and that
      # spec must agree. Both come from one source in the kit, and the value
      # is a major bound, not an exact pin.
      runic_version: '1'
    secrets: inherit  # pragma: allowlist secret
